<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA na Escola</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>🤖 IA na Escola</h1>

        <p>
            Descubra como a Inteligência Artificial pode ajudar
            nos estudos!
        </p>

        <h2>Escolha uma pergunta:</h2>

        <div class="botoes">
            <button onclick="mostrarResposta(0)">
                O que é IA?
            </button>

            <button onclick="mostrarResposta(1)">
                Como a IA ajuda nos estudos?
            </button>

            <button onclick="mostrarResposta(2)">
                A IA pode fazer meu trabalho?
            </button>

            <button onclick="mostrarResposta(3)">
                Quais são os cuidados?
            </button>
        </div>

        <div id="resposta">
            <p>Escolha uma pergunta acima 👆</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
